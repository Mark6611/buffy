name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check (svelte-check)
        run: npm run check
      - name: Unit tests (vitest)
        run: npm test
      - name: Web build
        run: npm run build
      # The web build uses adapter-vercel, so there is no build/ here; the client CSS
      # is in .svelte-kit/output/client for either adapter.
      - name: Built-CSS floor (iOS 15)
        run: node scripts/verify-bundle-css.mjs .svelte-kit/output/client

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E (Playwright)
        run: npm run test:e2e
